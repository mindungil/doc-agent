version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc-agent-backend
    ports:
      - "7001:7000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://host.docker.internal:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-dept_knowledge}
      - LLM_API_URL=${LLM_API_URL:-http://192.168.0.201:30010/v1/chat/completions}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-/mnt/ssd16tb/MiniMaxAI--MiniMax-M2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-large-instruct}
      - DEEPSEEK_OCR_URL=${DEEPSEEK_OCR_URL:-http://220.124.155.35:30100}
      - DEEPSEEK_OCR_API_KEY=${DEEPSEEK_OCR_API_KEY:-}
      - DEEPSEEK_OCR_TIMEOUT=${DEEPSEEK_OCR_TIMEOUT:-60}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/documents.db
      - UPLOAD_DIR=./uploads
      - ADMIN_ID=${ADMIN_ID:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-wjsqnrai}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./backend/test_three_stage_pipeline.py:/app/test_three_stage_pipeline.py:ro
      - ./backend/app:/app/app
      - ./csv:/app/csv:ro
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doc-agent-frontend
    ports:
      - "0.0.0.0:7000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge


